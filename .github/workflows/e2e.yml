name: e2e

# Deploys the module into the test AWS account, sends real alerts through it,
# and destroys everything. Separate from test.yml because it needs AWS
# credentials and must never be cancelled mid-apply. See docs/ci.md.

on:
  pull_request:
    branches: [main]
    paths:
      - "*.tf"
      - "src/**"
      - "tests/e2e/**"
      - ".github/workflows/e2e.yml"
  schedule:
    # Weekly, an hour after test.yml, to catch AWS-side drift.
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a run in progress: killing it mid-destroy leaves resources
# billing in the test account.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: ${{ vars.AWS_TF_TEST_REGION || 'us-east-1' }}

jobs:
  e2e:
    # Fork PRs get no secrets or OIDC token, so they can't run this.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    # Headroom above the step timeouts below, so a hung step fails on its
    # own and destroy still gets to run.
    timeout-minutes: 45
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: tests/e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_TF_TEST_ACCESS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          # Keeps the account ID out of the logs.
          mask-aws-account-id: true
      - name: Run ID and receiver token
        run: |
          token=$(openssl rand -hex 32)
          echo "::add-mask::$token"
          {
            echo "TF_VAR_run_id=ci-e2e-${{ github.run_id }}-${{ github.run_attempt }}"
            echo "TF_VAR_receiver_token=$token"
          } >> "$GITHUB_ENV"
      - name: Init
        id: init
        run: terraform init -backend=false
      - name: Apply
        timeout-minutes: 10
        run: terraform apply -auto-approve
      - name: Relay alerts
        timeout-minutes: 12
        run: ./run.sh
      # Local state on the runner: this step is the only thing that can clean
      # up, so it runs whatever happened above.
      - name: Destroy
        if: always() && steps.init.outcome == 'success'
        timeout-minutes: 15
        run: |
          for attempt in 1 2 3; do
            terraform destroy -auto-approve && exit 0
            echo "destroy attempt $attempt failed; retrying in 30s"
            sleep 30
          done
          echo "::error::Destroy failed. Resources tagged RunId=$TF_VAR_run_id may be left in the test account; see docs/ci.md."
          exit 1
